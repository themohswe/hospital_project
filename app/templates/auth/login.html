
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | CareHub</title>

    <link rel="stylesheet" href=" {{ url_for('static', filename='css/login.css')}}">
</head>

<body>
    <main class="signin-container">

        <!-- Logo -->
        <header class="signin-header">
            <a href="{{ url_for('main.home')}}" class="logo">
                <span class="logo-icon">✚</span>
                <span>Care<span class="logo-highlight">Hub</span></span>
            </a>

            <h1>Welcome Back</h1>
            <p>Sign in to your CareHub account</p>
        </header>

        <!-- Sign In Form -->
        <form class="signin-form" action="/login" method="POST">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="signin-button">
                SIGN IN
            </button>

        </form>

        <!-- Register Link -->
        <div class="signup-link">
            <p>Don't have an account?
                <a href="{{ url_for('auth.register')}}">Create an account</a>
            </p>
        </div>

        <footer class="signin-footer">
            <a href="{{ url_for('main.home')}}">← Back to CareHub Home</a>
        </footer>

    </main>
</body>
</html>
